[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finn-foundation"
version = "1.5.4"
description = "Strict schemas, routing policy, and SQLite caching for FINN"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "requests>=2.32.4,<3", "yfinance>=0.2.66,<2", "pandas>=2.2,<4", "beautifulsoup4>=4.13,<5", "curl_cffi>=0.15,<1", "pymupdf>=1.26.6,<2", "ddgs>=9.16.1,<10", "google-generativeai>=0.8.6,<0.9", "google-api-core>=2.24,<2.34", "tzdata>=2025.2; sys_platform == 'win32'"]

[tool.setuptools.package-data]
"backend.data" = ["seed_announcements.json"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
